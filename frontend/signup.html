<!DOCTYPE html>
<html>
    <head>
        <title>Signup Page</title>
    </head>
    <body>
        <h2>Signup - LocalBuddies</h2>
        <h2>Create an account 
            Enter your details below:</h2>
        <form action="/signup" method="post">
             <input type="text" placeholder="Full Name" required><br><br>
             <input type="text" placeholder="Username" required><br><br>
             <input type="email" placeholder="Email Address" required><br><br>
             <input type="password" placeholder="Password" required><br><br>

            <button type="submit">Register</button>
        </form>
    <a href="login.html">
        <button type="button">Already have an account? Login</button>
